services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-clinica_san_rafael}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinica_san_rafael}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clinica_network

  redis:
    image: redis:7-alpine
    container_name: clinica_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clinica_network

volumes:
  postgres_data:
    name: clinica_postgres_data
  redis_data:
    name: clinica_redis_data

networks:
  clinica_network:
    name: clinica_network
    driver: bridge
